name: Supabase Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database / API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEFAULT_PROJECT_URL: "https://rmbwggnxscuzpwqywtig.supabase.co"
          DEFAULT_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtYndnZ254c2N1enB3cXl3dGlnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTE5MDAyNCwiZXhwIjoyMDkwNzY2MDI0fQ.SKxVO2ieCyHW8vL08vmFg70gOt_iTEkec8o_AAbfi5M"
        run: |
          # Define URL target (Edge function or REST API endpoint)
          if [ -n "$SUPABASE_FUNCTION_URL" ]; then
            TARGET_URL="$SUPABASE_FUNCTION_URL"
          elif [ -n "$SUPABASE_URL" ]; then
            TARGET_URL="${SUPABASE_URL%/}/rest/v1/"
          else
            TARGET_URL="${DEFAULT_PROJECT_URL}/rest/v1/"
          fi

          # Define API Key (use secret if defined, otherwise fallback to default key)
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY:-$DEFAULT_KEY}}"

          echo "Pinging Supabase target: $TARGET_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$TARGET_URL")

          echo "Supabase HTTP response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Supabase keepalive ping successful! (HTTP $HTTP_STATUS)"
            exit 0
          else
            echo "Error: Received HTTP $HTTP_STATUS from Supabase"
            exit 1
          fi
